<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="Bookmark" href="http://www.fawu.xyz/favicon.ico">
    <title>案件受理费计算器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#f5f7fa;
            font-family:"微软雅黑",Microsoft YaHei;
            padding:30px 20px;
        }
        .container{
            max-width:550px;
            margin:0 auto;
            background:#fff;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            overflow:hidden;
        }
        .title{
            background:#FFFADF;
            padding:20px;
            text-align:center;
            color:#008000;
            font-size:22px;
            font-weight:bold;
        }
        .tip{
            background:#FFF4F9;
            padding:10px;
            text-align:center;
            font-size:14px;
            color:#666;
        }
        .content{
            padding:30px;
            background:#EDFEEE;
        }
        .input-row{
            margin-bottom:20px;
        }
        .input-row label{
            font-size:16px;
            font-weight:bold;
            display:block;
            margin-bottom:8px;
        }
        .input-box{
            width:100%;
            padding:12px 15px;
            font-size:16px;
            border:1px solid #ddd;
            border-radius:6px;
            outline:none;
        }
        .calc-btn{
            width:100%;
            padding:14px;
            background:#008000;
            color:#fff;
            font-size:16px;
            font-weight:bold;
            border:none;
            border-radius:6px;
            cursor:pointer;
            margin-bottom:25px;
        }
        .calc-btn:hover{
            background:#006600;
        }
        .result-item{
            display:flex;
            align-items:center;
            margin-bottom:15px;
            font-size:16px;
        }
        .result-item label{
            width:150px;
            font-weight:bold;
        }
        .result-box{
            flex:1;
            padding:10px 12px;
            border:1px solid #ccc;
            border-radius:6px;
            background:#fff;
            font-size:15px;
        }
        .reset-btn{
            width:100%;
            padding:10px;
            background:#e74c3c;
            color:#fff;
            border:none;
            border-radius:6px;
            cursor:pointer;
            margin-top:10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">法院案件受理保全执行费用计算</div>
    <div class="tip">计算结果仅供参考，以当地法院收费为准</div>
    
    <div class="content">
        <div class="input-row">
            <label>请输入标的金额（元）：</label>
            <input type="text" id="money" class="input-box" placeholder="请输入案件标的金额">
        </div>

        <button class="calc-btn" onclick="calcAll()">一键计算费用</button>

        <!-- 结果区域 -->
        <div class="result-item">
            <label>诉讼受理费：</label>
            <div id="res1" class="result-box">0.00</div>
        </div>
        <!-- 诉讼费减半 -->
        <div class="result-item">
            <label>诉讼费减半：</label>
            <div id="resHalf" class="result-box">0.00</div>
        </div>
        <div class="result-item">
            <label>财产保全费：</label>
            <div id="res2" class="result-box">0.00</div>
        </div>
        <div class="result-item">
            <label>法院执行费：</label>
            <div id="res3" class="result-box">0.00</div>
        </div>

        <button class="reset-btn" onclick="resetAll()">清空重置</button>
    </div>
</div>

<script>
// 一键计算全部
function calcAll(){
    var val = parseFloat(document.getElementById('money').value) || 0;
    var shou = calcShou(val);
    var bao = calcBao(val);
    var zhi = calcZhi(val);
    // 计算减半金额
    var half = shou / 2;
    
    document.getElementById('res1').innerText = shou.toFixed(2);
    document.getElementById('resHalf').innerText = half.toFixed(2);
    document.getElementById('res2').innerText = bao.toFixed(2);
    document.getElementById('res3').innerText = zhi.toFixed(2);
}

// 计算受理费
function calcShou(shuru){
    var result = 0;
    if (shuru>0 && shuru<=10000) result=50;
    else if (shuru>10000 && shuru<=100000) result=shuru*0.025-200;
    else if (shuru>100000 && shuru<=200000) result=shuru*0.02+300;
    else if (shuru>200000 && shuru<=500000) result=shuru*0.015+1300;
    else if (shuru>500000 && shuru<=1000000) result=shuru*0.01+3800;
    else if (shuru>1000000 && shuru<=2000000) result=shuru*0.009+4800;
    else if (shuru>2000000 && shuru<=5000000) result=shuru*0.008+6800;
    else if (shuru>5000000 && shuru<=10000000) result=shuru*0.007+11800;
    else if (shuru>10000000 && shuru<=20000000) result=shuru*0.006+21800;
    else if (shuru>20000000) result=shuru*0.005+41800;
    return result<0 ? 0 : result;
}

// 计算保全费
function calcBao(shuru){
    var result=0;
    if(shuru>0 && shuru<=1000) result=30;
    else if(shuru>1000 && shuru<=100000) result=shuru*0.01+20;
    else if(shuru>100000) result=shuru*0.005+520;
    if(result>=5000) result=5000;
    return result<0 ? 0 : result;
}

// 计算执行费
function calcZhi(shuru){
    var result=0;
    if(shuru>0 && shuru<10000) result=50;
    else if(shuru>=10000 && shuru<=500000) result=shuru*0.015-100;
    else if(shuru>=500000 && shuru<=5000000) result=shuru*0.01+2400;
    else if(shuru>10000000) result=shuru*0.001+67400;
    return result<0 ? 0 : result;
}

// 清空
function resetAll(){
    document.getElementById('money').value = '';
    document.getElementById('res1').innerText = '0.00';
    document.getElementById('resHalf').innerText = '0.00';
    document.getElementById('res2').innerText = '0.00';
    document.getElementById('res3').innerText = '0.00';
}
</script>

</body>
</html>
